<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" role="img" aria-label="dsh-eye logo">
  <defs>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#37e6c8"/>
      <stop offset="70%" stop-color="#0e7a6a"/>
      <stop offset="100%" stop-color="#053b33"/>
    </radialGradient>
  </defs>
  <!-- 眼睑（杏仁形） -->
  <path d="M16 60 Q100 -14 184 60 Q100 134 16 60 Z" fill="#04060b" stroke="#37e6c8" stroke-width="4" stroke-linejoin="round"/>
  <!-- 虹膜 -->
  <circle cx="100" cy="60" r="38" fill="url(#iris)" opacity="0.9"/>
  <circle cx="100" cy="60" r="38" fill="none" stroke="#37e6c8" stroke-width="2.5" opacity="0.7"/>
  <!-- 瞳孔 -->
  <circle cx="100" cy="60" r="16" fill="#ffb454"/>
  <circle cx="100" cy="60" r="16" fill="none" stroke="#04060b" stroke-width="2"/>
  <!-- 高光 -->
  <circle cx="90" cy="50" r="5" fill="#eafffb" opacity="0.95"/>
  <circle cx="112" cy="70" r="2.5" fill="#eafffb" opacity="0.6"/>
  <!-- 扫描线（数据感） -->
  <line x1="16" y1="60" x2="184" y2="60" stroke="#ffb454" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.75"/>
  <!-- 上下睫毛短线 -->
  <line x1="52" y1="26" x2="58" y2="34" stroke="#37e6c8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="70" y1="18" x2="73" y2="28" stroke="#37e6c8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="148" y1="26" x2="142" y2="34" stroke="#37e6c8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="130" y1="18" x2="127" y2="28" stroke="#37e6c8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
</svg>
